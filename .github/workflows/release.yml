name: Build Test and Release

on:
  push:
    branches:
      - release
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        if: ${{ hashFiles('app/Cargo.toml') != '' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc,x86_64-pc-windows-msvc

      - name: Setup Go
        if: ${{ hashFiles('core/go.mod') != '' }}
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Run Rust tests
        if: ${{ hashFiles('app/Cargo.toml') != '' }}
        shell: pwsh
        run: |
          cargo test --manifest-path app/Cargo.toml --all-targets --locked

      - name: Run Go tests
        if: ${{ hashFiles('core/go.mod') != '' }}
        shell: pwsh
        run: |
          Push-Location core
          go test ./...
          Pop-Location

      - name: Build x86 and x64 binaries
        if: ${{ hashFiles('app/Cargo.toml') != '' }}
        shell: pwsh
        run: |
          cargo build --manifest-path app/Cargo.toml --release --target i686-pc-windows-msvc --locked
          cargo build --manifest-path app/Cargo.toml --release --target x86_64-pc-windows-msvc --locked

      - name: Collect release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null

          if (Test-Path app/Cargo.toml) {
            $exe32 = Get-ChildItem -Path app/target/i686-pc-windows-msvc/release -Filter *.exe -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1
            $exe64 = Get-ChildItem -Path app/target/x86_64-pc-windows-msvc/release -Filter *.exe -ErrorAction SilentlyContinue | Sort-Object LastWriteTime -Descending | Select-Object -First 1

            if ($exe32) { Copy-Item -LiteralPath $exe32.FullName -Destination dist/JiYuNext-x86.exe -Force }
            if ($exe64) { Copy-Item -LiteralPath $exe64.FullName -Destination dist/JiYuNext-x64.exe -Force }
          }

          $count = (Get-ChildItem -Path dist -File -ErrorAction SilentlyContinue | Measure-Object).Count
          if ($count -eq 0) {
            throw "No release artifacts produced. Ensure app/Cargo.toml exists and builds successfully."
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: jiyunext-release-assets
          path: dist/*
          if-no-files-found: error

      - name: Create release tag
        id: tag
        shell: pwsh
        run: |
          $tag = "release-$($env:GITHUB_RUN_NUMBER)-$($env:GITHUB_SHA.Substring(0,7))"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: JiYuNext ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/JiYuNext-x86.exe
            dist/JiYuNext-x64.exe
